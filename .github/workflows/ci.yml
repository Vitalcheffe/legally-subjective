name: data-validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Golden regression test (the sample is the invariant)
        run: python scripts/tests/test_golden_sample.py
      - name: Validate sample data integrity
        run: python scripts/verify_data.py --mode sample
      - name: Validate corpus data integrity (1,387 cases)
        run: python scripts/verify_data.py --mode corpus
