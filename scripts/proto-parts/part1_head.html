<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFINITUM — Prototype : cinq métaphores d'interface (jMail abandonné)</title>
<!--
  PROTOTYPE JETABLE — Question tranchée : « À quoi doit ressembler la vitrine
  publique d'INFINITUM, maintenant que la métaphore jMail/Gmail est abandonnée ? »
  Cinq variantes radicalement différentes, commutables via ?variant= (S, A, B, C, D, E)
  et la barre flottante (ou les touches ←/→).
  Intégrité des données : les faits biographiques et jurisprudentiels sont RÉELS et
  publics (Cour suprême des États-Unis, Caselaw Access Project, CourtListener).
  Les champs analytiques (scores, prédictions, constellations) portent le marqueur † :
  format d'affichage illustratif — les valeurs seront produites uniquement par le
  moteur réel. Aucune donnée simulée ne sera présentée comme réelle.
-->
<style>
/* ============ CHROME DU PROTOTYPE (ne fait partie d'aucune variante) ============ */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:#E9E6DE; }

.proto-strip{
  position:fixed; top:0; left:0; right:0; z-index:1000;

  font:11px/1.5 ui-monospace,'Courier New',monospace;
  letter-spacing:.04em; padding:6px 16px; text-align:center;
}

.proto-strip .dagger{ color:#E0B74F; }

.proto-bar{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:1000;
  display:flex; align-items:center; gap:0;
  background:#20242B; color:#F4EFE4;
  border-radius:999px; padding:6px 8px;
  box-shadow:0 8px 28px rgba(15,18,24,.38), 0 2px 6px rgba(15,18,24,.28);
  font:12px/1 ui-monospace,'Courier New',monospace;
  user-select:none;
}
.proto-bar button{
  appearance:none; border:0; background:#333944; color:#F4EFE4;
  width:34px; height:34px; border-radius:999px; cursor:pointer;
  font-size:15px; line-height:1;
}
.proto-bar button:hover{ background:#454D5C; }
.proto-bar .pb-label{
  min-width:280px; text-align:center; padding:0 18px;
  letter-spacing:.06em; text-transform:uppercase; font-size:11.5px;
}
.proto-bar .pb-label small{ display:block; margin-top:4px; color:#9AA2B1; text-transform:none; letter-spacing:.02em; font-size:10.5px; }

main#app{ padding-top:30px; }
.variant{ display:none; min-height:calc(100vh - 30px); padding-bottom:110px; }
.variant.on{ display:block; }

/* ============ Généralités typographiques partagées ============ */

.mono{ font-family:ui-monospace,'Courier New',monospace; }

/* ================================================================== */
/* VARIANT S — SOMMAIRE / CHOISIR                                      */
